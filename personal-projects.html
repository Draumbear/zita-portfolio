<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting… — Zita Decoopman</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<!-- This project's content is managed through the dashboard now and lives at
     project.html?slug=personal-projects (data/projects/personal-projects.json). This file used to
     be a hand-built copy of the same project: it was NOT editable from the
     dashboard and kept rendering an old, diverging version of the page for
     anyone who reached it, which is exactly the confusion this redirect
     removes. Kept as a redirect (rather than deleted) so existing links and
     bookmarks still land on the right project. The original markup is in
     git history if it's ever needed. -->
<meta http-equiv="refresh" content="0; url=project.html?slug=personal-projects">
<link rel="canonical" href="project.html?slug=personal-projects">
</head>
<body>
<script>location.replace('project.html?slug=personal-projects');</script>
<p>Redirecting to <a href="project.html?slug=personal-projects">this project</a>…</p>
</body>
</html>
